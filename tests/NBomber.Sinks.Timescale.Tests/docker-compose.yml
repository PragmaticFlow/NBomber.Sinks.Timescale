services:

  timescaledb:
    image: timescale/timescaledb:2.25.0-pg18-oss
    restart: always
    environment:
      POSTGRES_DB: nb_studio_db
      POSTGRES_USER: timescaledb
      POSTGRES_PASSWORD: timescaledb
      TS_TUNE_MAX_CONNS: "3000"
    ports:
      - "5432:5432"
    volumes:
      - nb_studio_data:/var/lib/postgresql/data
    command: ["postgres"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d 'user=timescaledb dbname=nb_studio_db'" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s
  
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - timescaledb

  nats:
    image: "nats:2.9.9"
    command: --js
    ports:
        - "8222:8222"
        - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  nb_studio_data:
    driver: local

  pgadmin-data:
    driver: local